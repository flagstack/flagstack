services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: flagstack
      POSTGRES_USER: flagstack
      POSTGRES_PASSWORD: ${FLAGSTACK_POSTGRES_PASSWORD:-flagstack}
    volumes:
      - flagstack-selfhost-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagstack -d flagstack"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
    image: flagstack/flagstack:local
    command: ["/app/flagstack-migrate"]
    environment:
      FLAGSTACK_DATABASE_URL: postgres://flagstack:${FLAGSTACK_POSTGRES_PASSWORD:-flagstack}@postgres:5432/flagstack?sslmode=disable
      FLAGSTACK_LOG_LEVEL: ${FLAGSTACK_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  flagstack:
    build:
      context: .
    image: flagstack/flagstack:local
    environment:
      FLAGSTACK_DATABASE_URL: postgres://flagstack:${FLAGSTACK_POSTGRES_PASSWORD:-flagstack}@postgres:5432/flagstack?sslmode=disable
      FLAGSTACK_HTTP_ADDR: :8080
      FLAGSTACK_LOG_LEVEL: ${FLAGSTACK_LOG_LEVEL:-info}
      FLAGSTACK_SESSION_TTL: ${FLAGSTACK_SESSION_TTL:-168h}
      FLAGSTACK_SESSION_COOKIE_SECURE: ${FLAGSTACK_SESSION_COOKIE_SECURE:-false}
      FLAGSTACK_STATIC_DIR: /app/frontend
    ports:
      - "${FLAGSTACK_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  flagstack-selfhost-postgres:
