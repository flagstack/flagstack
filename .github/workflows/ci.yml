name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Ent client
        run: go generate ./ent

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FLAGSTACK_DATABASE_URL: postgres://flagstack:flagstack@localhost:5432/flagstack?sslmode=disable
      FLAGSTACK_TEST_DATABASE_URL: postgres://flagstack:flagstack@localhost:5432/flagstack?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flagstack
          POSTGRES_USER: flagstack
          POSTGRES_PASSWORD: flagstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagstack -d flagstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Ent client
        run: go generate ./ent

      - name: Apply Ent migrations
        run: go run ./cmd/flagstack-migrate

      - name: Test database integration
        run: go test ./internal/database -count=1

      - name: Reapply Ent migrations
        run: go run ./cmd/flagstack-migrate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  selfhost:
    name: Self-hosted image
    runs-on: ubuntu-latest
    needs:
      - backend
      - database
      - frontend
    env:
      FLAGSTACK_POSTGRES_PASSWORD: ci-flagstack
      FLAGSTACK_PORT: 18080
      FLAGSTACK_SESSION_COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose -f compose.selfhost.yml config >/dev/null

      - name: Build and start self-hosted stack
        run: docker compose -f compose.selfhost.yml up -d --build

      - name: Smoke-test application and frontend
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 2
          done
          echo "FlagStack self-hosted stack did not become ready."
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose -f compose.selfhost.yml logs --no-color

      - name: Stop self-hosted stack
        if: always()
        run: docker compose -f compose.selfhost.yml down -v

  devcontainer:
    name: Dev container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate configuration
        run: python3 -m json.tool .devcontainer/devcontainer.json >/dev/null

      - name: Check shell scripts
        run: shellcheck .devcontainer/post-create.sh .devcontainer/scripts/*.sh

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
