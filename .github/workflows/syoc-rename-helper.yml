name: Materialize Switch On Your Code rename

on:
  push:
    branches:
      - agent/syoc-rename-helper

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/syoc-rename-helper
          fetch-depth: 0

      - name: Rename product
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import hashlib
          import struct

          root = Path('.')
          helper = Path('.github/workflows/syoc-rename-helper.yml')

          def humanize_markdown(text: str) -> str:
              parts = re.split(r'(```[\s\S]*?```)', text)
              for index in range(0, len(parts), 2):
                  inline = re.split(r'(`[^`\n]+`)', parts[index])
                  for j in range(0, len(inline), 2):
                      inline[j] = re.sub(r'\bSwitchOnYourCode\b', 'Switch On Your Code', inline[j])
                  parts[index] = ''.join(inline)
              return ''.join(parts)

          bucket_map = {
              '22683': '3837',
              '91560': '35203',
              '53181': '95458',
              '17185': '50332',
              '87178': '66174',
              '35740': '59926',
              '69539': '94257',
              '82981': '14338',
              '86769': '28947',
              '91129': '90951',
              '15580': '99275',
          }

          prose_names = {'LICENSE', 'NOTICE'}
          prose_suffixes = {'.md', '.rst', '.txt'}
          bucket_suffixes = {'.go', '.ts', '.tsx', '.js', '.mjs', '.cjs', '.py', '.cs', '.json', '.md'}

          for path in list(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == helper:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              original = text
              text = text.replace('fs_server_', 'syoc_server_')
              text = text.replace('fs_client_', 'syoc_client_')
              text = text.replace('FLAGSTACK', 'SWITCHONYOURCODE')
              text = text.replace('flagstack', 'switchonyourcode')
              text = text.replace('FlagStack', 'SwitchOnYourCode')
              text = text.replace('switchonyourcode.io', 'switchonyourcode.com')

              if path.suffix.lower() in bucket_suffixes or path.name in prose_names:
                  for old, new in bucket_map.items():
                      text = text.replace(old, new)

              if path.suffix.lower() in prose_suffixes or path.name in prose_names:
                  text = humanize_markdown(text)
              else:
                  text = text.replace('"SwitchOnYourCode"', '"Switch On Your Code"')
                  text = text.replace("'SwitchOnYourCode'", "'Switch On Your Code'")
                  text = text.replace('`SwitchOnYourCode`', '`Switch On Your Code`')
                  text = text.replace('>SwitchOnYourCode<', '>Switch On Your Code<')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          vectors = Path('spec/evaluation-v1-vectors.json')
          if vectors.exists():
              data = json.loads(vectors.read_text(encoding='utf-8'))
              for vector in data.get('bucket_vectors', []):
                  payload = f"switchonyourcode-v1\0{vector['environment_id']}\0{vector['flag_id']}\0{vector['bucket_value']}".encode()
                  vector['bucket'] = struct.unpack('>I', hashlib.sha256(payload).digest()[:4])[0] % 100000
              for vector in data.get('scalar_bucket_vectors', []):
                  payload = f"switchonyourcode-v1\0env-1\0flag-1\0{vector['serialized']}".encode()
                  vector['bucket'] = struct.unpack('>I', hashlib.sha256(payload).digest()[:4])[0] % 100000
              vectors.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Rename brand-bearing files and directories bottom-up.
          paths = sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts and p != helper],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for path in paths:
              if not path.exists():
                  continue
              new_name = path.name.replace('FLAGSTACK', 'SWITCHONYOURCODE').replace('FlagStack', 'SwitchOnYourCode').replace('flagstack', 'switchonyourcode')
              if new_name != path.name:
                  path.rename(path.with_name(new_name))

          if helper.exists():
              helper.unlink()
          PY

      - name: Commit materialized tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: Materialize Switch On Your Code rename."
          git push origin HEAD:agent/syoc-rename-helper
