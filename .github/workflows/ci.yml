name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://flagstack:flagstack@localhost:5432/flagstack?sslmode=disable
      FLAGSTACK_TEST_DATABASE_URL: postgres://flagstack:flagstack@localhost:5432/flagstack?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flagstack
          POSTGRES_USER: flagstack
          POSTGRES_PASSWORD: flagstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagstack -d flagstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir migrations postgres "$DATABASE_URL" up

      - name: Test database connection
        run: go test ./internal/database -run TestOpenIntegration -count=1

      - name: Reverse migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir migrations postgres "$DATABASE_URL" reset

      - name: Reapply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir migrations postgres "$DATABASE_URL" up

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  devcontainer:
    name: Dev container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate configuration
        run: python3 -m json.tool .devcontainer/devcontainer.json >/dev/null

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck .devcontainer/post-create.sh .devcontainer/scripts/*.sh

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
