name: Evaluation Finalize Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          ref: agent/evaluation-finalize-helper

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply final evaluator hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evaluation = Path('backend/internal/evaluation/evaluation.go')
          text = evaluation.read_text()
          if '\t"io"\n' not in text:
              text = text.replace('\t"fmt"\n', '\t"fmt"\n\t"io"\n')
          old = '''\tif decoder.More() {
          \t\treturn nil, fmt.Errorf("multiple JSON values are not allowed")
          \t}
          \treturn value, nil
          '''
          new = '''\tvar extra any
          \tif err := decoder.Decode(&extra); err != io.EOF {
          \t\treturn nil, fmt.Errorf("multiple JSON values are not allowed")
          \t}
          \treturn value, nil
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('decodeRaw block not found')
          evaluation.write_text(text)

          repository = Path('backend/internal/database/targeting_repository.go')
          text = repository.read_text()
          marker = '''type TargetingRepository struct {
          \tclient *flagstackent.Client
          }
          '''
          replacement = '''const scheduleClaimLease = 2 * time.Minute

          type TargetingRepository struct {
          \tclient *flagstackent.Client
          }
          '''
          if 'const scheduleClaimLease' not in text:
              if marker not in text:
                  raise SystemExit('TargetingRepository marker not found')
              text = text.replace(marker, replacement, 1)

          old = '''func (r *TargetingRepository) ClaimDueScheduledChanges(ctx context.Context, now time.Time, limit int) ([]coretargeting.ScheduledChange, error) {
          \tentities, err := r.client.ScheduledFlagChange.Query().Where(
          \t\tentscheduledflagchange.StatusEQ("pending"),
          \t\tentscheduledflagchange.ExecuteAtLTE(now),
          \t).Order(flagstackent.Asc(entscheduledflagchange.FieldExecuteAt), flagstackent.Asc(entscheduledflagchange.FieldID)).Limit(limit).All(ctx)
          \tif err != nil {
          \t\treturn nil, fmt.Errorf("list due scheduled flag changes: %w", err)
          \t}

          \tclaimed := make([]coretargeting.ScheduledChange, 0, len(entities))
          \tfor _, entity := range entities {
          \t\ttoken := uuid.New()
          \t\tcount, err := r.client.ScheduledFlagChange.Update().Where(
          \t\t\tentscheduledflagchange.ID(entity.ID),
          \t\t\tentscheduledflagchange.StatusEQ("pending"),
          \t\t\tentscheduledflagchange.ExecuteAtLTE(now),
          \t\t).SetStatus("running").SetClaimToken(token).SetClaimedAt(now).Save(ctx)
          \t\tif err != nil {
          \t\t\treturn nil, fmt.Errorf("claim scheduled flag change: %w", err)
          \t\t}
          \t\tif count != 1 {
          \t\t\tcontinue
          \t\t}
          \t\tchange, err := scheduledChangeFromEntity(entity)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tchange.Status = "running"
          \t\tchange.ClaimToken = token.String()
          \t\tclaimedAt := now
          \t\tchange.ClaimedAt = &claimedAt
          \t\tclaimed = append(claimed, change)
          \t}
          \treturn claimed, nil
          }
          '''
          new = '''func (r *TargetingRepository) ClaimDueScheduledChanges(ctx context.Context, now time.Time, limit int) ([]coretargeting.ScheduledChange, error) {
          \tstaleBefore := now.Add(-scheduleClaimLease)
          \teligible := entscheduledflagchange.Or(
          \t\tentscheduledflagchange.And(
          \t\t\tentscheduledflagchange.StatusEQ("pending"),
          \t\t\tentscheduledflagchange.ExecuteAtLTE(now),
          \t\t),
          \t\tentscheduledflagchange.And(
          \t\t\tentscheduledflagchange.StatusEQ("running"),
          \t\t\tentscheduledflagchange.ClaimedAtNotNil(),
          \t\t\tentscheduledflagchange.ClaimedAtLTE(staleBefore),
          \t\t),
          \t)
          \tentities, err := r.client.ScheduledFlagChange.Query().Where(eligible).
          \t\tOrder(flagstackent.Asc(entscheduledflagchange.FieldExecuteAt), flagstackent.Asc(entscheduledflagchange.FieldID)).
          \t\tLimit(limit).
          \t\tAll(ctx)
          \tif err != nil {
          \t\treturn nil, fmt.Errorf("list due scheduled flag changes: %w", err)
          \t}

          \tclaimed := make([]coretargeting.ScheduledChange, 0, len(entities))
          \tfor _, entity := range entities {
          \t\ttoken := uuid.New()
          \t\tcount, err := r.client.ScheduledFlagChange.Update().Where(
          \t\t\tentscheduledflagchange.ID(entity.ID),
          \t\t\tentscheduledflagchange.Or(
          \t\t\t\tentscheduledflagchange.And(
          \t\t\t\t\tentscheduledflagchange.StatusEQ("pending"),
          \t\t\t\t\tentscheduledflagchange.ExecuteAtLTE(now),
          \t\t\t\t),
          \t\t\t\tentscheduledflagchange.And(
          \t\t\t\t\tentscheduledflagchange.StatusEQ("running"),
          \t\t\t\t\tentscheduledflagchange.ClaimedAtNotNil(),
          \t\t\t\t\tentscheduledflagchange.ClaimedAtLTE(staleBefore),
          \t\t\t\t),
          \t\t\t),
          \t\t).SetStatus("running").SetClaimToken(token).SetClaimedAt(now).Save(ctx)
          \t\tif err != nil {
          \t\t\treturn nil, fmt.Errorf("claim scheduled flag change: %w", err)
          \t\t}
          \t\tif count != 1 {
          \t\t\tcontinue
          \t\t}
          \t\tchange, err := scheduledChangeFromEntity(entity)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tchange.Status = "running"
          \t\tchange.ClaimToken = token.String()
          \t\tclaimedAt := now
          \t\tchange.ClaimedAt = &claimedAt
          \t\tclaimed = append(claimed, change)
          \t}
          \treturn claimed, nil
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('ClaimDueScheduledChanges block not found')
          repository.write_text(text)

          service = Path('backend/internal/targeting/targeting.go')
          text = service.read_text()
          old = '''func (s *Service) validateClaimedChange(ctx context.Context, change ScheduledChange) error {
          \tif change.Patch.Policy == nil {
          \t\treturn nil
          \t}
          \tstate, err := s.repository.GetFlagState(ctx, change.OrganisationID, change.ProjectID, change.FeatureFlagID)
          \tif err != nil {
          \t\treturn err
          \t}
          \tif err := evaluation.ValidateDefinition(state.Kind, state.DefaultValue, state.Variants, *change.Patch.Policy); err != nil {
          \t\treturn err
          \t}
          \tsegments, err := s.repository.ListSegments(ctx, change.OrganisationID, change.ProjectID)
          \tif err != nil {
          \t\treturn err
          \t}
          \treturn evaluation.ValidatePolicySegments(*change.Patch.Policy, evaluationSegments(segments))
          }
          '''
          new = '''func (s *Service) validateClaimedChange(ctx context.Context, change ScheduledChange) error {
          \tflag, segments, err := s.repository.LoadEvaluation(
          \t\tctx,
          \t\tchange.OrganisationID,
          \t\tchange.ProjectID,
          \t\tchange.EnvironmentID,
          \t\tchange.FeatureFlagID,
          \t)
          \tif err != nil {
          \t\treturn err
          \t}
          \tif change.Patch.Policy == nil {
          \t\treturn nil
          \t}
          \tif err := evaluation.ValidateDefinition(flag.Kind, flag.DefaultValue, flag.Variants, *change.Patch.Policy); err != nil {
          \t\treturn err
          \t}
          \treturn evaluation.ValidatePolicySegments(*change.Patch.Policy, segments)
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('validateClaimedChange block not found')
          service.write_text(text)
          PY

          cd backend
          go generate ./ent
          gofmt -w internal/evaluation internal/targeting internal/database internal/httpapi internal/app
          go test ./...
          cd ..

          if ! git diff --quiet -- backend/internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/internal
            git commit -m "backend: Harden targeting schedule execution."
            git push origin HEAD:agent/evaluation-finalize-helper
          fi
