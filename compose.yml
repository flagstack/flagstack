services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: flagstack
      POSTGRES_USER: flagstack
      POSTGRES_PASSWORD: flagstack
    ports:
      - "5432:5432"
    volumes:
      - flagstack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagstack -d flagstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flagstack-postgres:
