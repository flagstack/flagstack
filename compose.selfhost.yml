services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: switchonyourcode
      POSTGRES_USER: switchonyourcode
      POSTGRES_PASSWORD: ${SWITCHONYOURCODE_POSTGRES_PASSWORD:-switchonyourcode}
    volumes:
      - switchonyourcode-selfhost-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchonyourcode -d switchonyourcode"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
    image: switchonyourcode/switchonyourcode:local
    command: ["/app/switchonyourcode-migrate"]
    environment:
      SWITCHONYOURCODE_DATABASE_URL: postgres://switchonyourcode:${SWITCHONYOURCODE_POSTGRES_PASSWORD:-switchonyourcode}@postgres:5432/switchonyourcode?sslmode=disable
      SWITCHONYOURCODE_LOG_LEVEL: ${SWITCHONYOURCODE_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  switchonyourcode:
    build:
      context: .
    image: switchonyourcode/switchonyourcode:local
    environment:
      SWITCHONYOURCODE_DATABASE_URL: postgres://switchonyourcode:${SWITCHONYOURCODE_POSTGRES_PASSWORD:-switchonyourcode}@postgres:5432/switchonyourcode?sslmode=disable
      SWITCHONYOURCODE_HTTP_ADDR: :8080
      SWITCHONYOURCODE_LOG_LEVEL: ${SWITCHONYOURCODE_LOG_LEVEL:-info}
      SWITCHONYOURCODE_SESSION_TTL: ${SWITCHONYOURCODE_SESSION_TTL:-168h}
      SWITCHONYOURCODE_SESSION_COOKIE_SECURE: ${SWITCHONYOURCODE_SESSION_COOKIE_SECURE:-false}
      SWITCHONYOURCODE_STATIC_DIR: /app/frontend
    ports:
      - "${SWITCHONYOURCODE_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  switchonyourcode-selfhost-postgres:
