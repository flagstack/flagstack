name: Format Switch On Your Code rename

on:
  pull_request:
    branches:
      - agent/syoc-rename-helper

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/switch-on-your-code-rename'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@v6
        with:
          ref: agent/switch-on-your-code-rename
          fetch-depth: 0

      - name: Format Go sources
        run: gofmt -w backend

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: Format renamed Go sources."
          git push origin HEAD:agent/switch-on-your-code-rename
